<footer class="footer border-top py-3 mt-5 bg-white small">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="row align-items-center my-1">
            <div class="col-md-6 text-center text-md-left mb-2 mb-md-0 text-muted">
                <span>&copy; {{ "now" | date: "%Y" }} {{ site.title }}. All rights reserved.</span>
                <span class="mx-1">•</span>
                <i>Last updated: {{ "now" | date: "%b %Y" }}</i>
            </div>
            <div class="col-md-6 text-center text-md-right text-muted">
                {{ site.data.display.footer_text }}
            </div>
        </div>
    </div>
</footer>
