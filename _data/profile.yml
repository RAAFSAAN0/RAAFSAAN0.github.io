short_bio: >-
  <p>
    I am a Computer Science and Engineering graduate with research interests
    in <strong>robust, explainable, and trustworthy deep learning</strong>,
    with a particular interest in <strong>computer vision, generative models,
    anomaly detection, and representation learning</strong>.
  </p>
  <p>
    My research focuses on developing reliable deep learning systems that can
    better detect, explain, and withstand anomalous and adversarial behavior.
    My undergraduate thesis explored latent-space anomaly detection using
    explainable AI to enhance the robustness of generative adversarial networks.
  </p>

