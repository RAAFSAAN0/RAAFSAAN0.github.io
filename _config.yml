# Welcome to Jekyll!
#
# Site configuration for Rafsan Mahmud's academic homepage.

# ============================================================
# Site settings
# ============================================================

title: "Rafsan Mahmud"
email: ""
description: "Rafsan Mahmud - Academic Homepage"
url: "https://raafsaan0.github.io"
baseurl: ""

# ============================================================
# Build settings
# ============================================================

markdown: kramdown

plugins:
  - jekyll-email-protect

# ============================================================
# Exclude from processing
# ============================================================

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# ============================================================
# Collections
# ============================================================

collections:
  publications:
    output: true
  news:
    output: true
  showcase:
    output: true
  posts:
    output: true

# ============================================================
# Timezone
# ============================================================

timezone: Asia/Dhaka
