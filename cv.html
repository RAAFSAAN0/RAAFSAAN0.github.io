---
layout: default
title: CV
navbar_title: CV
---

<style>
    .cv-page {
        max-width: 1180px;
        margin: 0 auto;
        padding: 42px 20px 60px;
    }

    .cv-header {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
        margin-bottom: 22px;
    }

    .cv-header-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 24px 28px;
    }

    .cv-title-wrapper {
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .cv-icon {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eff6ff;
        color: #2563eb;
        border-radius: 10px;
        font-size: 22px;
        flex-shrink: 0;
    }

    .cv-title {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        color: #1e293b;
        line-height: 1.2;
    }

    .cv-subtitle {
        margin: 6px 0 0;
        color: #64748b;
        font-size: 14px;
    }

    .cv-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }

    .cv-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none !important;
        transition: all 0.2s ease;
        white-space: nowrap;
    }

    .cv-btn-primary {
        background: #2563eb;
        color: #ffffff !important;
        border: 1px solid #2563eb;
    }

    .cv-btn-primary:hover {
        background: #1d4ed8;
        border-color: #1d4ed8;
        color: #ffffff !important;
        transform: translateY(-1px);
    }

    .cv-btn-secondary {
        background: #ffffff;
        color: #334155 !important;
        border: 1px solid #cbd5e1;
    }

    .cv-btn-secondary:hover {
        background: #f8fafc;
        border-color: #94a3b8;
        color: #1e293b !important;
        transform: translateY(-1px);
    }

    .cv-viewer-wrapper {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }

    .cv-viewer-toolbar {
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
    }

    .viewer-label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #334155;
        font-size: 14px;
        font-weight: 600;
    }

    .viewer-label i {
        color: #dc2626;
    }

    .viewer-status {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #64748b;
        font-size: 12px;
    }

    .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #22c55e;
        display: inline-block;
    }

    .cv-pdf-container {
        height: 82vh;
        min-height: 680px;
        background: #e9edf2;
    }

    .cv-pdf-container iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
    }

    .cv-note {
        text-align: center;
        margin-top: 14px;
        color: #94a3b8;
        font-size: 12px;
    }

    @media (max-width: 768px) {
        .cv-page {
            padding: 28px 14px 40px;
        }

        .cv-header-content {
            flex-direction: column;
            align-items: flex-start;
            padding: 20px;
        }

        .cv-actions {
            width: 100%;
        }

        .cv-btn {
            flex: 1;
        }

        .cv-title {
            font-size: 24px;
        }

        .cv-pdf-container {
            height: 75vh;
            min-height: 560px;
        }
    }

    @media (max-width: 480px) {
        .cv-title-wrapper {
            gap: 12px;
        }

        .cv-icon {
            width: 46px;
            height: 46px;
            font-size: 19px;
        }

        .cv-title {
            font-size: 21px;
        }

        .cv-subtitle {
            font-size: 13px;
        }

        .cv-actions {
            flex-direction: column;
        }

        .cv-btn {
            width: 100%;
            flex: none;
        }

        .cv-viewer-toolbar {
            padding: 0 14px;
        }
    }
</style>

<div class="cv-page">

    <!-- Header -->
    <div class="cv-header">
        <div class="cv-header-content">

            <div class="cv-title-wrapper">
                <div class="cv-icon">
                    <i class="fas fa-file-alt"></i>
                </div>

                <div>
                    <h1 class="cv-title">Curriculum Vitae</h1>
                    <p class="cv-subtitle">
                        Academic &amp; Research Profile · Rafsan Mahmud
                    </p>
                </div>
            </div>

            <div class="cv-actions">

                <!-- Download CV -->
                <a
                    href="https://drive.google.com/uc?export=download&id=1sWr7JcOmN2T10zFaFnQMhGplpuFHFeRo"
                    class="cv-btn cv-btn-primary"
                >
                    <i class="fas fa-download"></i>
                    <span>Download PDF</span>
                </a>

                <!-- Open CV -->
                <a
                    href="https://drive.google.com/file/d/1sWr7JcOmN2T10zFaFnQMhGplpuFHFeRo/view?usp=sharing"
                    class="cv-btn cv-btn-secondary"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <i class="fas fa-external-link-alt"></i>
                    <span>Open PDF</span>
                </a>

            </div>

        </div>
    </div>

    <!-- CV Viewer -->
    <div class="cv-viewer-wrapper">

        <div class="cv-viewer-toolbar">

            <div class="viewer-label">
                <i class="fas fa-file-pdf"></i>
                <span>Curriculum Vitae</span>
            </div>

            <div class="viewer-status">
                <span class="status-dot"></span>
                <span>PDF Viewer</span>
            </div>

        </div>

        <div class="cv-pdf-container">

            <!-- Google Drive CV Preview -->
            <iframe
                src="https://drive.google.com/file/d/1sWr7JcOmN2T10zFaFnQMhGplpuFHFeRo/preview"
                title="Rafsan Mahmud Curriculum Vitae"
                allow="autoplay"
            ></iframe>

        </div>

    </div>

    <!-- Footer Note -->
    <div class="cv-note">
        Latest version of the academic CV · PDF
    </div>

</div>
