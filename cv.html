---
layout: default
title: CV
navbar_title: CV
---

<style>
    /* =========================================================
       CV PAGE
       ========================================================= */

    .cv-page {
        max-width: 1180px;
        margin: 0 auto;
        padding: 42px 20px 60px;
    }

    /* Header */
    .cv-header {
        position: relative;
        overflow: hidden;
        background: #ffffff;
        border: 1px solid #e8edf3;
        border-radius: 18px;
        padding: 28px 32px;
        margin-bottom: 24px;
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
    }

    .cv-header::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, #2563eb, #4f46e5, #7c3aed);
    }

    .cv-header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 25px;
    }

    .cv-title-wrapper {
        display: flex;
        align-items: center;
        gap: 17px;
    }

    .cv-icon {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eff6ff;
        color: #2563eb;
        font-size: 22px;
        flex-shrink: 0;
    }

    .cv-title {
        margin: 0;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.4px;
        color: #172033;
    }

    .cv-subtitle {
        margin: 5px 0 0;
        color: #64748b;
        font-size: 14px;
    }

    /* Buttons */
    .cv-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }

    .cv-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 10px 16px;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none !important;
        transition: all 0.2s ease;
        white-space: nowrap;
    }

    .cv-btn-primary {
        color: #ffffff !important;
        background: #2563eb;
        border: 1px solid #2563eb;
    }

    .cv-btn-primary:hover {
        background: #1d4ed8;
        border-color: #1d4ed8;
        transform: translateY(-1px);
        box-shadow: 0 5px 14px rgba(37, 99, 235, 0.22);
    }

    .cv-btn-secondary {
        color: #334155 !important;
        background: #ffffff;
        border: 1px solid #d8dee8;
    }

    .cv-btn-secondary:hover {
        color: #2563eb !important;
        border-color: #2563eb;
        background: #f8fbff;
    }

    /* PDF area */
    .cv-viewer-wrapper {
        background: #f1f5f9;
        border: 1px solid #e3e8ef;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
    }

    .cv-viewer-toolbar {
        height: 50px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #ffffff;
        border-bottom: 1px solid #e8edf3;
    }

    .viewer-label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #64748b;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2px;
    }

    .viewer-status {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #64748b;
        font-size: 12px;
    }

    .status-dot {
        width: 7px;
        height: 7px;
        background: #22c55e;
        border-radius: 50%;
    }

    .cv-pdf-container {
        height: 82vh;
        min-height: 680px;
        background: #e9edf2;
    }

    .cv-pdf-container object {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
    }

    /* Fallback */
    .pdf-fallback {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
    }

    .pdf-fallback-card {
        max-width: 420px;
        text-align: center;
        background: #ffffff;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
    }

    .pdf-fallback-icon {
        font-size: 42px;
        color: #ef4444;
        margin-bottom: 15px;
    }

    .pdf-fallback-card h5 {
        margin-bottom: 8px;
        font-weight: 700;
        color: #172033;
    }

    .pdf-fallback-card p {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 20px;
    }

    /* Footer note */
    .cv-note {
        text-align: center;
        margin-top: 18px;
        color: #94a3b8;
        font-size: 12px;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 768px) {

        .cv-page {
            padding: 25px 14px 40px;
        }

        .cv-header {
            padding: 22px;
            border-radius: 15px;
        }

        .cv-header-content {
            flex-direction: column;
            align-items: flex-start;
        }

        .cv-actions {
            width: 100%;
        }

        .cv-btn {
            flex: 1;
        }

        .cv-title {
            font-size: 22px;
        }

        .cv-icon {
            width: 46px;
            height: 46px;
            font-size: 19px;
        }

        .cv-viewer-wrapper {
            border-radius: 15px;
        }

        .cv-viewer-toolbar {
            padding: 0 13px;
        }

        .cv-pdf-container {
            height: 75vh;
            min-height: 550px;
        }
    }

    @media (max-width: 430px) {

        .cv-title-wrapper {
            gap: 12px;
        }

        .cv-title {
            font-size: 20px;
        }

        .cv-subtitle {
            font-size: 13px;
        }

        .cv-actions {
            flex-direction: column;
        }

        .cv-btn {
            width: 100%;
        }

        .viewer-status {
            display: none;
        }

        .cv-pdf-container {
            min-height: 500px;
        }
    }
</style>


<div class="cv-page">

    <!-- =====================================================
         HEADER
         ====================================================== -->

    <div class="cv-header">

        <div class="cv-header-content">

            <div class="cv-title-wrapper">

                <div class="cv-icon">
                    <i class="fas fa-file-alt"></i>
                </div>

                <div>
                    <h1 class="cv-title">Curriculum Vitae</h1>
                    <p class="cv-subtitle">
                        Academic &amp; Research Profile · Rafsan Mahmud
                    </p>
                </div>

            </div>


            <div class="cv-actions">

                <a
                    href="{{ '/assets/CV.pdf' | relative_url }}"
                    class="cv-btn cv-btn-primary"
                    download
                >
                    <i class="fas fa-download"></i>
                    <span>Download PDF</span>
                </a>

                <a
                    href="{{ '/assets/CV.pdf' | relative_url }}"
                    class="cv-btn cv-btn-secondary"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <i class="fas fa-external-link-alt"></i>
                    <span>Open PDF</span>
                </a>

            </div>

        </div>

    </div>


    <!-- =====================================================
         PDF VIEWER
         ====================================================== -->

    <div class="cv-viewer-wrapper">

        <div class="cv-viewer-toolbar">

            <div class="viewer-label">
                <i class="fas fa-file-pdf"></i>
                <span>Curriculum Vitae</span>
            </div>

            <div class="viewer-status">
                <span class="status-dot"></span>
                <span>PDF Viewer</span>
            </div>

        </div>


        <div class="cv-pdf-container">

            <object
                data="{{ '/assets/CV.pdf' | relative_url }}"
                type="application/pdf"
            >

                <div class="pdf-fallback">

                    <div class="pdf-fallback-card">

                        <div class="pdf-fallback-icon">
                            <i class="fas fa-file-pdf"></i>
                        </div>

                        <h5>Unable to display the CV</h5>

                        <p>
                            Your browser does not support embedded PDF viewing.
                            You can open the CV directly in a new tab.
                        </p>

                        <a
                            href="{{ '/assets/CV.pdf' | relative_url }}"
                            class="cv-btn cv-btn-primary"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            <i class="fas fa-external-link-alt"></i>
                            Open CV
                        </a>

                    </div>

                </div>

            </object>

        </div>

    </div>


    <div class="cv-note">
        Latest version of the academic CV · PDF
    </div>

</div>
