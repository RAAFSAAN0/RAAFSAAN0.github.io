<!-- PDF.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
</script>

<div class="container-lg py-4">
    <!-- Header Controls -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body p-3 d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <h4 class="font-weight-bold mb-0">Curriculum Vitae</h4>
                <p class="text-muted small mb-0">Rafsan Mahmud</p>
            </div>
            <div class="mt-2 mt-sm-0">
                <a href="https://drive.google.com/uc?export=download&id=1qfFiutvnWXtVvTX8eP-TUuSz98UaKJLl" class="btn btn-primary btn-sm mr-2" target="_blank">
                    <i class="fas fa-download mr-1"></i> Download PDF
                </a>
                <a href="https://drive.google.com/file/d/1qfFiutvnWXtVvTX8eP-TUuSz98UaKJLl/view?usp=sharing" class="btn btn-outline-secondary btn-sm" target="_blank">
                    <i class="fas fa-external-link-alt mr-1"></i> Open in Drive
                </a>
            </div>
        </div>
    </div>

    <!-- Seamless Clean Canvas Container -->
    <div class="card shadow-sm border-0 rounded-lg overflow-hidden p-3 bg-white">
        <div id="pdf-container" class="w-100 d-flex flex-column align-items-center overflow-auto" style="max-height: 85vh;">
            <div id="loading-spinner" class="py-5 text-center text-muted">
                <div class="spinner-border spinner-border-sm mr-2" role="status"></div> Loading document...
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Direct link to Google Drive PDF stream
        var url = 'https://docs.google.com/uc?export=download&id=1qfFiutvnWXtVvTX8eP-TUuSz98UaKJLl';
        var container = document.getElementById('pdf-container');
        var spinner = document.getElementById('loading-spinner');

        pdfjsLib.getDocument(url).promise.then(function(pdf) {
            if (spinner) spinner.style.display = 'none';

            for (var pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                pdf.getPage(pageNum).then(function(page) {
                    var canvas = document.createElement('canvas');
                    canvas.className = 'shadow-sm rounded mb-3 w-100';
                    canvas.style.maxWidth = '900px';
                    container.appendChild(canvas);

                    var context = canvas.getContext('2d');
                    var viewport = page.getViewport({ scale: 1.5 });

                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    var renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    page.render(renderContext);
                });
            }
        }).catch(function(error) {
            // Fallback display if CORS restricts client fetching directly
            if (spinner) {
                spinner.innerHTML = '<iframe src="https://drive.google.com/file/d/1qfFiutvnWXtVvTX8eP-TUuSz98UaKJLl/preview" width="100%" height="700px" style="border:none;"></iframe>';
            }
        });
    });
</script>
